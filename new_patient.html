{% extends "base.html" %}
{% block title %}New case{% endblock %}
{% block content %}
<p class="page-title">New case</p>
<p class="page-subtitle">For a patient who hasn't visited before. Everything is filled once, here.</p>

<form method="post" class="card">
  <p class="section-label">Patient details</p>
  <div class="field-grid" style="margin-bottom:20px;">
    <div><label>Registration no.</label><input type="text" name="registration_no" required></div>
    <div><label>Patient name</label><input type="text" name="name" required></div>
    <div><label>Date of birth</label><input type="date" name="dob"></div>
    <div>
      <label>Gender</label>
      <select name="gender">
        <option value=""></option>
        {% for g in genders %}<option value="{{ g }}">{{ g }}</option>{% endfor %}
      </select>
    </div>
    <div><label>Phone number</label><input type="text" name="phone_number" placeholder="91XXXXXXXXXX"></div>
    <div><label>City</label><input type="text" name="city"></div>
    <div><label>Country</label><input type="text" name="country" value="India"></div>
    <div>
      <label>Source</label>
      <select name="source">
        <option value=""></option>
        {% for s in sources %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <p class="section-label">First visit</p>
  <div class="field-grid">
    <div><label>Visit date</label><input type="date" name="visit_date" required></div>
    <div>
      <label>Consultation mode</label>
      <select name="consultation_mode">
        <option value=""></option>
        {% for c in consultation_modes %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
      </select>
    </div>
    <div><label>Charges</label><input type="number" step="0.01" name="charges"></div>
    <div class="span-3"><label>Notes</label><textarea name="notes"></textarea></div>
    <div><label>Medicine for (days)</label><input type="number" name="medicine_duration_days"></div>
    <div>
      <label>Mode of payment</label>
      <select name="payment_mode">
        <option value=""></option>
        {% for p in payment_modes %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
      </select>
    </div>
    <div><label>Next follow-up date</label><input type="date" name="next_followup_date"></div>
  </div>

  <button class="btn btn-primary" type="submit" style="margin-top:20px;">Save case</button>
</form>
{% endblock %}
