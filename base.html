<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clinic{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <p class="brand">Clinic Records</p>
      <nav>
        <a href="{{ url_for('patients') }}" class="{{ 'active' if active == 'patients' }}">Patients</a>
        <a href="{{ url_for('new_patient') }}" class="{{ 'active' if active == 'new' }}">New case</a>
        <a href="{{ url_for('export_page') }}" class="{{ 'active' if active == 'export' }}">Export data</a>
      </nav>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
