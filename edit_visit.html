{% extends "base.html" %}
{% block title %}Edit visit{% endblock %}
{% block content %}
<p class="page-title">Edit visit</p>
<p class="page-subtitle">{{ patient.name }} <span style="color:var(--ink-muted);">({{ patient.registration_no }})</span> &middot; {{ visit.visit_type }}</p>

<form method="post" class="card">
  <div class="field-grid">
    <div><label>Visit date</label><input type="date" name="visit_date" value="{{ visit.visit_date }}" required></div>
    <div>
      <label>Consultation mode</label>
      <select name="consultation_mode">
        <option value=""></option>
        {% for c in consultation_modes %}
          <option value="{{ c }}" {% if visit.consultation_mode == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div><label>Charges</label><input type="number" step="0.01" name="charges" value="{{ visit.charges or '' }}"></div>
    <div class="span-3"><label>Notes</label><textarea name="notes">{{ visit.notes or '' }}</textarea></div>
    <div><label>Medicine for (days)</label><input type="number" name="medicine_duration_days" value="{{ visit.medicine_duration_days or '' }}"></div>
    <div>
      <label>Mode of payment</label>
      <select name="payment_mode">
        <option value=""></option>
        {% for p in payment_modes %}
          <option value="{{ p }}" {% if visit.payment_mode == p %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
    </div>
    <div><label>Next follow-up date</label><input type="date" name="next_followup_date" value="{{ visit.next_followup_date or '' }}"></div>
  </div>

  <div style="margin-top:20px; display:flex; align-items:center; gap:10px;">
    <input type="checkbox" id="reminder_enabled" name="reminder_enabled" style="width:auto;" {% if visit.reminder_enabled %}checked{% endif %}>
    <label for="reminder_enabled" style="margin:0;">Send WhatsApp reminder for this follow-up</label>
  </div>

  <button class="btn btn-primary" type="submit" style="margin-top:20px;">Save changes</button>
</form>
{% endblock %}
